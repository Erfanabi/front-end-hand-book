<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1219" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Frontend Interview Handbook</title>
    <script>
      // Runs before first paint: avoids a theme flash and a direction flash.
      ;(function () {
        var stored = localStorage.getItem('theme')
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        var lang = location.pathname.split('/')[1] === 'en' ? 'en' : 'fa'
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
